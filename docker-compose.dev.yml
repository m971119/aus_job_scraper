services:
  backend:
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    command: sh -c "npm ci && npm run dev"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
