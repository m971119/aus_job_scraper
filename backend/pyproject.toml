[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.136.1",
    "playwright>=1.60.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "httpx>=0.28.1",
    "debugpy>=1.8.20",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (live network)",
]
asyncio_mode = "auto"
